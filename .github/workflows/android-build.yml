name: Android P0 Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: OSM pilot converter tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Bundle verified WFO mobile library and latest verified fish artifact into APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/scientific-library app/src/main/assets/scientific-library
          curl --fail --location --retry 3 --retry-delay 5 \
            --output build/scientific-library/WFO_Backbone.zip \
            'https://zenodo.org/records/20782718/files/_DwC_backbone_R.zip?download=1'
          unzip -t build/scientific-library/WFO_Backbone.zip >/dev/null
          python3 tools/fetch_wfo_backbone.py \
            --archive build/scientific-library/WFO_Backbone.zip \
            --output build/scientific-library/wfo-taxonomy.ndjson.gz \
            --metadata build/scientific-library/wfo-taxonomy.meta.json
          python3 tools/select_wfo_mobile_taxa.py \
            --input build/scientific-library/wfo-taxonomy.ndjson.gz \
            --output build/scientific-library/mobile.ndjson.gz
          python3 tools/build_scientific_sqlite.py \
            --input build/scientific-library/mobile.ndjson.gz \
            --source-meta build/scientific-library/wfo-taxonomy.meta.json \
            --output build/scientific-library/wfo-taxonomy.sqlite

          fish_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=FieldIntelligence-freshwater-fish-real&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          if [ -n "$fish_run" ]; then
            run_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${fish_run}" --jq '[.conclusion,.path,.head_branch] | @tsv')"
            IFS=$'\t' read -r conclusion workflow_path head_branch <<<"$run_state"
            if [ "$conclusion" != "success" ] || [ "$workflow_path" != ".github/workflows/build-vietnam-freshwater-fish.yml" ] || [ "$head_branch" != "main" ]; then
              echo "::error::Latest fish artifact is not from a successful trusted main-branch fish workflow run."
              exit 1
            fi
            rm -rf build/fish-real-artifact
            mkdir -p build/fish-real-artifact
            gh run download "$fish_run" --repo "$GITHUB_REPOSITORY" \
              --name FieldIntelligence-freshwater-fish-real \
              --dir build/fish-real-artifact
            fish_sqlite="$(find build/fish-real-artifact -type f -name fish.sqlite -print -quit)"
            test -n "$fish_sqlite"
            test -s "$fish_sqlite"
            python3 tools/merge_scientific_sqlite.py \
              --target build/scientific-library/wfo-taxonomy.sqlite \
              --source "$fish_sqlite" \
              --source-label "WFO 2026-06 + verified Vietnam freshwater fish"
            echo "$fish_run" > build/scientific-library/fish-source-run.txt
          else
            echo "No non-expired verified real-fish artifact is available; building a WFO-only test APK."
            echo "none" > build/scientific-library/fish-source-run.txt
          fi

          python3 tools/build_specialist_evidence_sqlite.py \
            --input data/scientific/specialist_evidence.json \
            --output build/scientific-library/specialist-evidence.sqlite
          python3 - <<'PY'
          import hashlib, json, sqlite3, zipfile
          from pathlib import Path
          root = Path('build/scientific-library')
          source = json.loads((root / 'wfo-taxonomy.meta.json').read_text())
          assert source['versionDoi'] == '10.5281/zenodo.20782718'
          with sqlite3.connect(root / 'wfo-taxonomy.sqlite') as db:
              count = db.execute('SELECT COUNT(*) FROM taxon').fetchone()[0]
              assert count >= 38100, count
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              meta = {k: json.loads(v) for k, v in db.execute('SELECT key,value FROM meta')}
              fish_taxa = int(meta.get('fishTaxa', 0) or 0)
              fish_local = int(meta.get('fishWithLocalMedia', 0) or 0)
              local_blobs = int(meta.get('localMediaBlobCount', 0) or 0)
              if fish_taxa:
                  assert fish_local > 0, meta
                  assert local_blobs > 0, meta
                  assert fish_local <= fish_taxa, meta
          files = []
          for name, version, scope in [('wfo-taxonomy.sqlite', 2, 'taxonomy-media-occurrence'), ('specialist-evidence.sqlite', 2, 'specialist-evidence-only')]:
              path = root / name
              files.append(dict(name=name, sha256=hashlib.sha256(path.read_bytes()).hexdigest(), sizeBytes=path.stat().st_size, schemaVersion=version, scope=scope))
          manifest = dict(manifestVersion=1, bundle='FieldIntelligence-WFO-mobile-selected-genera', files=files)
          output = Path('app/src/main/assets/scientific-library/FieldIntelligence-WFO-mobile.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for item in files:
                  archive.write(root / item['name'], item['name'])
              archive.writestr('scientific-library.manifest.json', json.dumps(manifest, ensure_ascii=False))
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
          print({'packRecords': count, 'fishTaxa': fish_taxa, 'fishWithLocalMedia': fish_local, 'localMediaBlobCount': local_blobs, 'packBytes': output.stat().st_size})
          PY

      - name: Bundle verified Google AIY Plants model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/visual-model
          curl --fail --location --retry 3 --max-time 180 \
            'https://tfhub.dev/google/lite-model/aiy/vision/classifier/plants_V1/3?lite-format=tflite' \
            -o app/src/main/assets/visual-model/aiy-plants-v1.tflite
          echo '9ff2cc02d066fc266045ce299f04fb76907d9313d576881b61c255aa19433521  app/src/main/assets/visual-model/aiy-plants-v1.tflite' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import io,zipfile
          data=Path('app/src/main/assets/visual-model/aiy-plants-v1.tflite').read_bytes()
          assert data[4:8]==b'TFL3'
          with zipfile.ZipFile(io.BytesIO(data)) as model:
              names=model.read('probability-labels-en.txt').decode().splitlines()
              assert len(names)==2102 and names[0]=='Betula lenta'
          PY

      - name: Build Main and Debug APKs
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldIntelligence-main-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldIntelligence-P0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
