name: Android P0 Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Vietnam Freshwater Fish Library Auto", "Enrich Missing Freshwater Fish Images", "Build Vietnam Fungi Offline"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: OSM pilot converter tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Bundle verified WFO mobile library and latest verified fish artifact into APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FISH_TRIGGER_RUN: ${{ github.event.workflow_run.name != 'Build Vietnam Fungi Offline' && github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          mkdir -p build/scientific-library app/src/main/assets/scientific-library
          curl --fail --location --retry 3 --retry-delay 5 \
            --output build/scientific-library/WFO_Backbone.zip \
            'https://zenodo.org/records/20782718/files/_DwC_backbone_R.zip?download=1'
          unzip -t build/scientific-library/WFO_Backbone.zip >/dev/null
          python3 tools/fetch_wfo_backbone.py \
            --archive build/scientific-library/WFO_Backbone.zip \
            --output build/scientific-library/wfo-taxonomy.ndjson.gz \
            --metadata build/scientific-library/wfo-taxonomy.meta.json
          python3 tools/select_wfo_mobile_taxa.py \
            --input build/scientific-library/wfo-taxonomy.ndjson.gz \
            --output build/scientific-library/mobile.ndjson.gz
          python3 tools/build_scientific_sqlite.py \
            --input build/scientific-library/mobile.ndjson.gz \
            --source-meta build/scientific-library/wfo-taxonomy.meta.json \
            --output build/scientific-library/wfo-taxonomy.sqlite

          fish_run="${FISH_TRIGGER_RUN:-}"
          if [ -z "$fish_run" ]; then
            fish_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=FieldIntelligence-freshwater-fish-partial&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          fi
          if [ -n "$fish_run" ]; then
            run_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${fish_run}" --jq '[.conclusion,.path,.head_branch] | @tsv')"
            IFS=$'\t' read -r conclusion workflow_path head_branch <<<"$run_state"
            case "$workflow_path" in
              .github/workflows/build-vietnam-freshwater-fish-auto.yml|.github/workflows/enrich-missing-freshwater-fish-images.yml) trusted_workflow=true ;;
              *) trusted_workflow=false ;;
            esac
            if [ "$conclusion" != "success" ] || [ "$trusted_workflow" != "true" ] || [ "$head_branch" != "main" ]; then
              echo "::error::Latest fish artifact is not from a successful trusted main-branch fish workflow run."
              exit 1
            fi
            rm -rf build/fish-real-artifact
            mkdir -p build/fish-real-artifact
            gh run download "$fish_run" --repo "$GITHUB_REPOSITORY" \
              --name FieldIntelligence-freshwater-fish-partial \
              --dir build/fish-real-artifact
            fish_sqlite="$(find build/fish-real-artifact -type f -name fish.sqlite -print -quit)"
            test -n "$fish_sqlite"
            test -s "$fish_sqlite"
            python3 tools/merge_scientific_sqlite.py \
              --target build/scientific-library/wfo-taxonomy.sqlite \
              --source "$fish_sqlite" \
              --source-label "WFO 2026-06 + audited partial Vietnam freshwater fish"
            python3 tools/propagate_fish_coverage_meta.py \
              --target build/scientific-library/wfo-taxonomy.sqlite \
              --source "$fish_sqlite"
            echo "$fish_run" > build/scientific-library/fish-source-run.txt
          else
            echo "No validated partial fish artifact is available; building a WFO-only test APK."
            echo "none" > build/scientific-library/fish-source-run.txt
          fi

          fungi_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=FieldIntelligence-vietnam-fungi-offline&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.created_at) | reverse | .[0].workflow_run.id // empty')"
          if [ -n "$fungi_run" ]; then
            fungi_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${fungi_run}" --jq '[.conclusion,.path,.head_branch] | @tsv')"
            IFS=$'\t' read -r fungi_conclusion fungi_path fungi_branch <<<"$fungi_state"
            test "$fungi_conclusion" = success
            test "$fungi_path" = .github/workflows/build-vietnam-fungi-offline.yml
            test "$fungi_branch" = main
            mkdir -p build/fungi-artifact
            gh run download "$fungi_run" --repo "$GITHUB_REPOSITORY" \
              --name FieldIntelligence-vietnam-fungi-offline --dir build/fungi-artifact
            test -s build/fungi-artifact/fungi.sqlite
            python3 tools/merge_scientific_sqlite.py \
              --target build/scientific-library/wfo-taxonomy.sqlite \
              --source build/fungi-artifact/fungi.sqlite \
              --source-label "WFO + audited fish + licensed Vietnam fungi"
            echo "$fungi_run" > build/scientific-library/fungi-source-run.txt
          fi
          if [ -n "$fish_run" ]; then
            python3 tools/propagate_fish_coverage_meta.py \
              --target build/scientific-library/wfo-taxonomy.sqlite \
              --source "$fish_sqlite"
          fi

          python3 tools/build_specialist_evidence_sqlite.py \
            --input data/scientific/specialist_evidence.json \
            --output build/scientific-library/specialist-evidence.sqlite
          python3 - <<'PY'
          import hashlib, json, sqlite3, zipfile
          from pathlib import Path
          root = Path('build/scientific-library')
          source = json.loads((root / 'wfo-taxonomy.meta.json').read_text())
          assert source['versionDoi'] == '10.5281/zenodo.20782718'
          with sqlite3.connect(root / 'wfo-taxonomy.sqlite') as db:
              count = db.execute('SELECT COUNT(*) FROM taxon').fetchone()[0]
              assert count >= 38100, count
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              meta = {k: json.loads(v) for k, v in db.execute('SELECT key,value FROM meta')}
              fish_taxa = int(meta.get('fishTaxa', 0) or 0)
              fish_local = int(meta.get('fishWithLocalMedia', 0) or 0)
              local_blobs = int(meta.get('localMediaBlobCount', 0) or 0)
              fungi = db.execute("SELECT COUNT(*) FROM taxon WHERE library_group='Nấm'").fetchone()[0]
              fungi_local = db.execute("""SELECT COUNT(*) FROM taxon t WHERE t.library_group='Nấm'
                AND EXISTS(SELECT 1 FROM species_media_local m WHERE m.source_id=t.source_id AND m.source_record_id=t.source_record_id)""").fetchone()[0]
              if (root / 'fungi-source-run.txt').exists():
                  assert fungi > 0 and fungi_local > 0 and fungi_local <= fungi, (fungi, fungi_local)
              if fish_taxa:
                  assert fish_local > 0, meta
                  assert local_blobs > 0, meta
                  assert fish_local <= fish_taxa, meta
                  gate = int(meta.get('fishCoverageGateVersion', -1))
                  assert gate in (0, 1), meta
                  assert (int(meta.get('fishChecklistReported',0)), int(meta.get('fishChecklistPresent',0)), int(meta.get('fishChecklistReview',0)), int(meta.get('fishChecklistExcluded',0))) == (772,736,29,7), meta
                  resolved = int(meta.get('fishPresentChecklistResolved',0))
                  unresolved = int(meta.get('fishPresentChecklistUnresolved',-1))
                  assert resolved > 0 and unresolved >= 0 and resolved + unresolved == 736, meta
                  accepted_present = int(meta.get('fishPresentAcceptedTaxa',0) or 0)
                  present_local = int(meta.get('fishPresentTaxaWithLocalMedia',0) or 0)
                  assert accepted_present > 0, meta
                  assert 0 <= present_local <= accepted_present <= resolved, meta
                  assert fish_local >= present_local, meta
                  if gate == 1:
                      assert unresolved == 0 and present_local == accepted_present, meta
          files = []
          for name, version, scope in [('wfo-taxonomy.sqlite', 2, 'taxonomy-media-occurrence'), ('specialist-evidence.sqlite', 2, 'specialist-evidence-only')]:
              path = root / name
              files.append(dict(name=name, sha256=hashlib.sha256(path.read_bytes()).hexdigest(), sizeBytes=path.stat().st_size, schemaVersion=version, scope=scope))
          manifest = dict(manifestVersion=1, bundle='FieldIntelligence-WFO-mobile-selected-genera', files=files)
          output = Path('app/src/main/assets/scientific-library/FieldIntelligence-WFO-mobile.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for item in files:
                  archive.write(root / item['name'], item['name'])
              archive.writestr('scientific-library.manifest.json', json.dumps(manifest, ensure_ascii=False))
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
          print({'packRecords': count, 'fishTaxa': fish_taxa, 'fishWithLocalMedia': fish_local, 'localMediaBlobCount': local_blobs, 'packBytes': output.stat().st_size})
          PY

      - name: Bundle verified Google AIY Plants model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/visual-model
          curl --fail --location --retry 3 --max-time 180 \
            'https://tfhub.dev/google/lite-model/aiy/vision/classifier/plants_V1/3?lite-format=tflite' \
            -o app/src/main/assets/visual-model/aiy-plants-v1.tflite
          echo '9ff2cc02d066fc266045ce299f04fb76907d9313d576881b61c255aa19433521  app/src/main/assets/visual-model/aiy-plants-v1.tflite' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          import io,zipfile
          data=Path('app/src/main/assets/visual-model/aiy-plants-v1.tflite').read_bytes()
          assert data[4:8]==b'TFL3'
          with zipfile.ZipFile(io.BytesIO(data)) as model:
              names=model.read('probability-labels-en.txt').decode().splitlines()
              assert len(names)==2102 and names[0]=='Betula lenta'
          PY

      - name: Build Main and Debug APKs
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldIntelligence-main-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FieldIntelligence-P0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
