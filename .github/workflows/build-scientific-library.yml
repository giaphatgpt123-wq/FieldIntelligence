name: Build Scientific Library

on:
  push:
    branches: [ "main" ]
    paths:
      - "tools/fetch_wfo_backbone.py"
      - "tools/test_fetch_wfo_backbone.py"
      - "tools/build_scientific_sqlite.py"
      - "tools/test_build_scientific_sqlite.py"
      - "tools/build_specialist_evidence_sqlite.py"
      - "tools/test_build_specialist_evidence_sqlite.py"
      - "tools/full_scientific_sources.json"
      - "data/scientific/specialist_evidence.json"
      - ".github/workflows/build-scientific-library.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  build-wfo-library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run ingestion tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Download official WFO June 2026 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/scientific-library
          curl --fail --location --retry 3 --retry-delay 5 \
            --output build/scientific-library/WFO_Backbone.zip \
            'https://zenodo.org/records/20782718/files/_DwC_backbone_R.zip?download=1'
          unzip -t build/scientific-library/WFO_Backbone.zip >/dev/null

      - name: Normalize complete WFO taxonomy
        run: |
          python3 tools/fetch_wfo_backbone.py \
            --archive build/scientific-library/WFO_Backbone.zip \
            --output build/scientific-library/wfo-taxonomy.ndjson.gz \
            --metadata build/scientific-library/wfo-taxonomy.meta.json

      - name: Build offline SQLite taxonomy index
        run: |
          python3 tools/build_scientific_sqlite.py \
            --input build/scientific-library/wfo-taxonomy.ndjson.gz \
            --source-meta build/scientific-library/wfo-taxonomy.meta.json \
            --output build/scientific-library/wfo-taxonomy.sqlite

      - name: Build specialist evidence SQLite pack
        run: |
          python3 tools/build_specialist_evidence_sqlite.py \
            --input data/scientific/specialist_evidence.json \
            --output build/scientific-library/specialist-evidence.sqlite

      - name: Validate scientific library package
        shell: bash
        run: |
          set -euo pipefail
          test -s build/scientific-library/wfo-taxonomy.ndjson.gz
          test -s build/scientific-library/wfo-taxonomy.meta.json
          test -s build/scientific-library/wfo-taxonomy.sqlite
          test -s build/scientific-library/specialist-evidence.sqlite
          python3 - <<'PY'
          import json, sqlite3
          p = json.load(open('build/scientific-library/wfo-taxonomy.meta.json', encoding='utf-8'))
          assert p['sourceId'] == 'wfo-taxonomic-backbone'
          assert p['license'] == 'CC0-1.0'
          assert p['scope'] == 'taxonomy-only'
          assert p['version'] == '2026-06'
          assert p['versionDoi'] == '10.5281/zenodo.20782718'
          assert p['recordCount'] > 100000, p['recordCount']
          db = sqlite3.connect('build/scientific-library/wfo-taxonomy.sqlite')
          row_count = db.execute('SELECT COUNT(*) FROM taxon').fetchone()[0]
          integrity = db.execute('PRAGMA integrity_check').fetchone()[0]
          meta = {k: json.loads(v) for k, v in db.execute('SELECT key,value FROM meta')}
          db.close()
          assert integrity == 'ok', integrity
          assert row_count == p['recordCount'], (row_count, p['recordCount'])
          assert meta['scope'] == 'taxonomy-only'
          assert meta['medicalClaimsIncluded'] is False

          evidence_db = sqlite3.connect('build/scientific-library/specialist-evidence.sqlite')
          evidence_count = evidence_db.execute('SELECT COUNT(*) FROM evidence').fetchone()[0]
          evidence_integrity = evidence_db.execute('PRAGMA integrity_check').fetchone()[0]
          evidence_meta = {k: json.loads(v) for k, v in evidence_db.execute('SELECT key,value FROM meta')}
          evidence_db.close()
          assert evidence_integrity == 'ok', evidence_integrity
          assert evidence_count >= 1
          assert evidence_meta['scope'] == 'specialist-evidence-only'
          assert evidence_meta['doseRecommendationsIncluded'] is False
          assert evidence_meta['treatmentRecommendationsIncluded'] is False
          assert evidence_meta['imageIdentificationIncluded'] is False
          print({'wfo': p, 'sqliteRows': row_count, 'specialistEvidenceRows': evidence_count})
          PY

      - name: Upload scientific library package
        uses: actions/upload-artifact@v4
        with:
          name: FieldIntelligence-WFO-scientific-library
          path: |
            build/scientific-library/wfo-taxonomy.ndjson.gz
            build/scientific-library/wfo-taxonomy.meta.json
            build/scientific-library/wfo-taxonomy.sqlite
            build/scientific-library/specialist-evidence.sqlite
          if-no-files-found: error
          retention-days: 30
