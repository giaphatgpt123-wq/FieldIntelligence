name: Build Vietnam Freshwater Fish Library

on:
  push:
    branches: [ "main" ]
    paths:
      - "tools/build_gbif_library.py"
      - "tools/test_build_gbif_library.py"
      - "tools/build_scientific_sqlite.py"
      - "tools/test_build_scientific_sqlite.py"
      - "tools/build_fishbase_vietnam_audit.py"
      - "tools/build_vietnam_freshwater_fish_checklist.py"
      - "tools/resolve_fish_checklist_gbif.py"
      - "tools/test_resolve_fish_checklist_gbif.py"
      - "tools/audit_resolved_fish_library_coverage.py"
      - "tools/test_audit_resolved_fish_library_coverage.py"
      - "tools/audit_fish_checklist_coverage.py"
      - "tools/test_audit_fish_checklist_coverage.py"
      - "tools/attach_fish_coverage_report.py"
      - "tools/reconcile_fish_checklist_taxonomy.py"
      - "tools/test_reconcile_fish_checklist_taxonomy.py"
      - "tools/merge_scientific_ndjson.py"
      - "tools/test_merge_scientific_ndjson.py"
      - "tools/cache_scientific_media.py"
      - "tools/test_cache_scientific_media.py"
      - "tools/attach_scientific_media_manifest.py"
      - "tools/test_attach_scientific_media_manifest.py"
      - "tools/merge_scientific_sqlite.py"
      - "tools/test_merge_scientific_sqlite.py"
      - "data/scientific/freshwater_fish_vietnam_ingestion.json"
      - "data/scientific/gbif_vietnam_freshwater_fish_download_template.json"
      - ".github/workflows/build-vietnam-freshwater-fish.yml"
  workflow_dispatch:
    inputs:
      gbif_dwca_url:
        description: 'HTTPS URL to an audited GBIF Darwin Core Archive for Vietnam freshwater fish'
        required: false
        type: string
      gbif_download_doi:
        description: 'GBIF download DOI, e.g. 10.15468/dl.xxxxxx'
        required: false
        type: string
      gbif_publisher:
        description: 'Dataset/download publisher attribution'
        required: false
        default: 'GBIF Secretariat and contributing publishers'
        type: string
      gbif_dataset_license:
        description: 'Licence recorded for the normalized GBIF dataset provenance'
        required: false
        default: 'CC-BY-4.0'
        type: choice
        options:
          - CC0-1.0
          - CC-BY-4.0
          - CC-BY-NC-4.0

permissions:
  contents: read

jobs:
  validate-fish-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run fish ingestion, resolver, reconciliation, merge and offline-media tests
        run: |
          python3 -m unittest \
            tools.test_build_gbif_library \
            tools.test_build_scientific_sqlite \
            tools.test_resolve_fish_checklist_gbif \
            tools.test_audit_resolved_fish_library_coverage \
            tools.test_audit_fish_checklist_coverage \
            tools.test_reconcile_fish_checklist_taxonomy \
            tools.test_merge_scientific_ndjson \
            tools.test_cache_scientific_media \
            tools.test_attach_scientific_media_manifest \
            tools.test_merge_scientific_sqlite

      - name: Validate fish ingestion contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('data/scientific/freshwater_fish_vietnam_ingestion.json',encoding='utf-8'))
          assert p['categoryId']=='freshwater-fish-vietnam'
          assert p['scope']['countryCode']=='VN'
          assert p['scope']['habitat']=='freshwater'
          counts=p['sources'][0]['observedCounts']
          assert counts['reported']==772
          assert counts['present']==736
          assert counts['possible']==29
          assert counts['absentOrRejected']==7
          assert counts['present']+counts['possible']+counts['absentOrRejected']==counts['reported']
          assert p['ingestionPolicy']['requireMediaLicenseForOfflineReuse'] is True
          assert p['ingestionPolicy']['doNotInferEdibilityOrSafety'] is True
          print({'contract':'PASS','counts':counts})
          PY

      - name: Build and validate representative fish SQLite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fish
          python3 - <<'PY'
          import csv
          rows=[
            dict(gbifID='1',scientificName='Channa striata (Bloch, 1793)',acceptedScientificName='Channa striata (Bloch, 1793)',acceptedTaxonKey='1',kingdom='Animalia',class_='Actinopterygii',order='Anabantiformes',family='Channidae',genus='Channa',countryCode='VN',vernacularName='Cá lóc',mediaType='StillImage',identifier='https://example.org/channa.jpg',creator='Fixture photographer',rightsHolder='Fixture collection',mediaLicense='CC-BY-4.0'),
            dict(gbifID='2',scientificName='Anabas testudineus (Bloch, 1792)',acceptedScientificName='Anabas testudineus (Bloch, 1792)',acceptedTaxonKey='2',kingdom='Animalia',class_='Actinopterygii',order='Anabantiformes',family='Anabantidae',genus='Anabas',countryCode='VN',vernacularName='Cá rô đồng')
          ]
          fields=['gbifID','scientificName','acceptedScientificName','acceptedTaxonKey','kingdom','class','order','family','genus','countryCode','vernacularName','mediaType','identifier','creator','rightsHolder','mediaLicense']
          with open('build/fish/occurrence.txt','w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,delimiter='\t'); w.writeheader()
              for r in rows:
                  r['class']=r.pop('class_'); w.writerow(r)
          PY
          python3 tools/build_gbif_library.py --input build/fish/occurrence.txt --output build/fish/fish.ndjson.gz --metadata build/fish/fish.meta.json --dataset-doi 10.15468/dl.fixture --publisher "FieldIntelligence CI fixture" --license CC-BY-4.0 --collapse-to-accepted-taxon
          python3 tools/build_scientific_sqlite.py --input build/fish/fish.ndjson.gz --source-meta build/fish/fish.meta.json --output build/fish/fish.sqlite
          python3 - <<'PY'
          import gzip,json,sqlite3
          with gzip.open('build/fish/fish.ndjson.gz','rt',encoding='utf-8') as handle:
              rows=[json.loads(line) for line in handle if line.strip()]
          assert len(rows)==2
          assert rows[0]['sourceScientificNames']
          db=sqlite3.connect('build/fish/fish.sqlite')
          meta={k:json.loads(v) for k,v in db.execute('select key,value from meta')}
          source=json.load(open('build/fish/fish.meta.json',encoding='utf-8'))
          report={
            'taxa':db.execute("select count(*) from taxon where library_group='Cá nước ngọt'").fetchone()[0],
            'media':db.execute('select count(*) from species_media').fetchone()[0],
            'fishWith2PlusMedia':meta.get('fishWith2PlusMedia',0),
            'rejectedMedia':meta.get('rejectedMediaCount',0),
            'vernacular':db.execute('select count(*) from vernacular_name').fetchone()[0],
            'occurrence':db.execute('select count(*) from occurrence_summary').fetchone()[0],
            'sourceRows':source.get('sourceRowCount',0),
            'collapsedToAcceptedTaxon':source.get('collapseToAcceptedTaxon',False),
            'integrity':db.execute('pragma integrity_check').fetchone()[0],
          }
          db.close()
          assert report['taxa']==2,report
          assert report['media']==1,report
          assert report['vernacular']==2,report
          assert report['sourceRows']==2,report
          assert report['collapsedToAcceptedTaxon'] is True,report
          assert report['integrity']=='ok',report
          open('build/fish/ingestion-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(report)
          PY

      - name: Install pinned FishBase audit reader for real pack
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gbif_dwca_url != '' }}
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'duckdb==1.4.1'

      - name: Build current audit-only Vietnam freshwater checklist
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gbif_dwca_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fish-real/audit
          python3 tools/build_fishbase_vietnam_audit.py \
            --version latest \
            --country-code 704 \
            --output build/fish-real/audit/vietnam-freshwater-fish.csv \
            --report build/fish-real/audit/fishbase-report.json \
            --expect-total 772 \
            --expect-present 736
          python3 tools/build_vietnam_freshwater_fish_checklist.py \
            --input build/fish-real/audit/vietnam-freshwater-fish.csv \
            --output build/fish-real/audit/vietnam-freshwater-fish.ndjson \
            --report build/fish-real/audit/normalized-report.json
          python3 - <<'PY'
          import json
          report=json.load(open('build/fish-real/audit/normalized-report.json',encoding='utf-8'))
          assert report=={'total':772,'present':736,'review':29,'excluded':7}, report
          print(report)
          PY

      - name: Resolve checklist names independently against GBIF Backbone
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gbif_dwca_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/resolve_fish_checklist_gbif.py \
            --checklist build/fish-real/audit/vietnam-freshwater-fish.ndjson \
            --output build/fish-real/audit/resolved-checklist.ndjson \
            --report build/fish-real/audit/resolver-report.json \
            --delay-seconds 0.05
          python3 - <<'PY'
          import json
          report=json.load(open('build/fish-real/audit/resolver-report.json',encoding='utf-8'))
          assert report['total']==772, report
          assert report['presentInput']==736, report
          assert report['reviewInput']==29, report
          assert report['excludedInput']==7, report
          assert report['presentResolved']==736, report
          assert report['presentNeedsReview']==0, report
          assert report['presentUnmatched']==0, report
          assert report['uniqueAcceptedPresentTaxa']>0, report
          print({k:report[k] for k in ('total','presentResolved','presentNeedsReview','presentUnmatched','uniqueAcceptedPresentTaxa')})
          PY

      - name: Build real GBIF fish pack when an audited DwC-A is supplied
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gbif_dwca_url != '' }}
        env:
          GBIF_DWCA_URL: ${{ inputs.gbif_dwca_url }}
          GBIF_DOWNLOAD_DOI: ${{ inputs.gbif_download_doi }}
          GBIF_PUBLISHER: ${{ inputs.gbif_publisher }}
          GBIF_DATASET_LICENSE: ${{ inputs.gbif_dataset_license }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GBIF_DWCA_URL" in https://*) ;; *) echo "DwC-A URL must use HTTPS"; exit 1;; esac
          test -n "$GBIF_DOWNLOAD_DOI"
          mkdir -p build/fish-real/dwca
          curl --fail --location --retry 3 --max-time 600 "$GBIF_DWCA_URL" -o build/fish-real/gbif.zip
          unzip -t build/fish-real/gbif.zip >/dev/null
          unzip -q build/fish-real/gbif.zip -d build/fish-real/dwca
          occurrence="$(find build/fish-real/dwca -type f \( -name occurrence.txt -o -name occurrences.txt \) | head -1)"
          multimedia="$(find build/fish-real/dwca -type f -name multimedia.txt | head -1 || true)"
          test -s "$occurrence"
          args=(--input "$occurrence" --output build/fish-real/fish.ndjson.gz --metadata build/fish-real/fish.meta.json --dataset-doi "$GBIF_DOWNLOAD_DOI" --publisher "$GBIF_PUBLISHER" --license "$GBIF_DATASET_LICENSE" --collapse-to-accepted-taxon --max-media-per-taxon 50)
          if [ -n "$multimedia" ]; then args+=(--multimedia "$multimedia"); fi
          python3 tools/build_gbif_library.py "${args[@]}"
          python3 tools/audit_resolved_fish_library_coverage.py \
            --resolved-checklist build/fish-real/audit/resolved-checklist.ndjson \
            --taxonomy build/fish-real/fish.ndjson.gz \
            --output build/fish-real/audit/reconciled.ndjson \
            --report build/fish-real/audit/coverage-report.json
          python3 - <<'PY'
          import json
          report=json.load(open('build/fish-real/audit/coverage-report.json',encoding='utf-8'))
          assert report['total']==772, report
          assert report['presentInput']==736, report
          assert report['reviewInput']==29, report
          assert report['excludedInput']==7, report
          assert report['resolvedPresentChecklistCount']==736, report
          assert report['unresolvedPresentChecklistCount']==0, report
          assert report['resolverBlockedPresentCount']==0, report
          assert report['missingLibraryPresentCount']==0, report
          assert report['reconciledPresentTaxonCount']>0, report
          print(report)
          PY
          python3 tools/build_scientific_sqlite.py --input build/fish-real/fish.ndjson.gz --source-meta build/fish-real/fish.meta.json --output build/fish-real/fish.sqlite

      - name: Cache licensed reference images and embed them in real fish SQLite
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gbif_dwca_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cache_scientific_media.py \
            --input build/fish-real/fish.ndjson.gz \
            --media-dir build/fish-real/media \
            --manifest build/fish-real/scientific-media.manifest.json \
            --max-per-record 2 \
            --max-bytes 5242880 \
            --max-total-bytes 268435456
          python3 tools/attach_scientific_media_manifest.py \
            --database build/fish-real/fish.sqlite \
            --manifest build/fish-real/scientific-media.manifest.json
          python3 tools/attach_fish_coverage_report.py \
            --database build/fish-real/fish.sqlite \
            --reconciled build/fish-real/audit/reconciled.ndjson \
            --coverage build/fish-real/audit/coverage-report.json \
            --expect-total 772 \
            --expect-present 736 \
            --expect-review 29 \
            --expect-excluded 7

      - name: Validate real fish coverage and offline-image gate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gbif_dwca_url != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sqlite3
          source=json.load(open('build/fish-real/fish.meta.json',encoding='utf-8'))
          db=sqlite3.connect('build/fish-real/fish.sqlite')
          meta={k:json.loads(v) for k,v in db.execute('select key,value from meta')}
          report={
            'sourceRows':source.get('sourceRowCount',0),
            'collapsedTaxa':source.get('recordCount',0),
            'collapsedToAcceptedTaxon':source.get('collapseToAcceptedTaxon',False),
            'fishTaxa':meta.get('fishTaxa',0),
            'fishWithMedia':meta.get('fishWithMedia',0),
            'fishWith2PlusMedia':meta.get('fishWith2PlusMedia',0),
            'fishPendingMedia':meta.get('fishPendingMedia',0),
            'validMedia':meta.get('mediaRecordCount',0),
            'rejectedMedia':meta.get('rejectedMediaCount',0),
            'fishWithLocalMedia':meta.get('fishWithLocalMedia',0),
            'localMediaRecordCount':meta.get('localMediaRecordCount',0),
            'localMediaBlobCount':meta.get('localMediaBlobCount',0),
            'localMediaBytes':meta.get('localMediaBytes',0),
            'sourceDoi':meta.get('sourceDoi',''),
            'fishChecklistReported':meta.get('fishChecklistReported',0),
            'fishChecklistPresent':meta.get('fishChecklistPresent',0),
            'fishChecklistReview':meta.get('fishChecklistReview',0),
            'fishChecklistExcluded':meta.get('fishChecklistExcluded',0),
            'fishPresentChecklistResolved':meta.get('fishPresentChecklistResolved',0),
            'fishPresentChecklistUnresolved':meta.get('fishPresentChecklistUnresolved',-1),
            'fishPresentAcceptedTaxa':meta.get('fishPresentAcceptedTaxa',0),
            'fishPresentTaxaWithLocalMedia':meta.get('fishPresentTaxaWithLocalMedia',0),
            'integrity':db.execute('pragma integrity_check').fetchone()[0],
          }
          db.close()
          assert report['collapsedToAcceptedTaxon'] is True, report
          assert report['sourceRows'] >= report['collapsedTaxa'] > 0, report
          assert report['fishTaxa'] > 0, report
          assert report['sourceDoi'], report
          assert report['fishWithLocalMedia'] > 0, report
          assert report['localMediaBlobCount'] > 0, report
          assert (report['fishChecklistReported'],report['fishChecklistPresent'],report['fishChecklistReview'],report['fishChecklistExcluded'])==(772,736,29,7), report
          assert report['fishPresentChecklistResolved']==736, report
          assert report['fishPresentChecklistUnresolved']==0, report
          assert report['fishPresentAcceptedTaxa']>0, report
          assert report['fishPresentTaxaWithLocalMedia']==report['fishPresentAcceptedTaxa'], report
          assert report['integrity']=='ok', report
          open('build/fish-real/ingestion-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(report)
          PY

      - name: Upload real fish normalized input, self-contained SQLite and reports
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.gbif_dwca_url != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FieldIntelligence-freshwater-fish-real
          path: |
            build/fish-real/fish.ndjson.gz
            build/fish-real/fish.sqlite
            build/fish-real/fish.meta.json
            build/fish-real/scientific-media.manifest.json
            build/fish-real/ingestion-report.json
            build/fish-real/audit/fishbase-report.json
            build/fish-real/audit/normalized-report.json
            build/fish-real/audit/resolver-report.json
            build/fish-real/audit/resolved-checklist.ndjson
            build/fish-real/audit/coverage-report.json
            build/fish-real/audit/reconciled.ndjson
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated fish ingestion fixture
        uses: actions/upload-artifact@v4
        with:
          name: FieldIntelligence-freshwater-fish-ingestion-validation
          path: |
            build/fish/fish.ndjson.gz
            build/fish/fish.sqlite
            build/fish/fish.meta.json
            build/fish/ingestion-report.json
          if-no-files-found: error
          retention-days: 30
