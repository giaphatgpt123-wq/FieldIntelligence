name: Đường ở đâu P0

on:
  push:
    branches:
      - feature/duong-o-dau-p0
    paths:
      - 'duongodau-app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/duong-o-dau-build.yml'
  pull_request:
    paths:
      - 'duongodau-app/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/duong-o-dau-build.yml'
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :duongodau-app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :duongodau-app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duong-o-dau-p0-apk
          path: duongodau-app/build/outputs/apk/debug/duongodau-app-debug.apk
          if-no-files-found: error
