name: Hoi Dung Mo Dung Android Build

on:
  push:
    branches: [ hoi-dung-mo-dung-build-v0.7 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hoi-dung-mo-dung/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Privacy gate
        run: bash tools/privacy_gate.sh
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hoi-dung-mo-dung-android-debug
          path: hoi-dung-mo-dung/android/app/build/outputs/apk/debug/app-debug.apk
