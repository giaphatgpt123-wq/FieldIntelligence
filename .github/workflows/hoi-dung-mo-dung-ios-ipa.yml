name: Hoi Dung Mo Dung iOS Build and IPA

on:
  push:
    branches: [ hoi-dung-mo-dung-build-v0.7 ]
    paths:
      - 'hoi-dung-mo-dung/ios/**'
      - '.github/workflows/hoi-dung-mo-dung-ios-ipa.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: hoi-dung-mo-dung/ios
    env:
      BUNDLE_ID: vn.local.hoidungmodung
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Privacy gate
        run: bash tools/privacy_gate.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned simulator app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HoiDungMoDung.xcodeproj \
            -scheme HoiDungMoDung \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -name 'HoiDungMoDung.app' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/HoiDungMoDung-simulator.app.zip"
          shasum -a 256 "$RUNNER_TEMP/HoiDungMoDung-simulator.app.zip"

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: hoi-dung-mo-dung-ios-simulator
          path: ${{ runner.temp }}/HoiDungMoDung-simulator.app.zip
          if-no-files-found: error

      - name: Check signing readiness
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for v in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_TEAM_ID; do
            if [ -z "${!v:-}" ]; then
              missing+=("$v")
            fi
          done

          if [ ${#missing[@]} -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Apple signing assets are present; signed IPA build will run.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "Signed IPA skipped because GitHub Secrets are missing: ${missing[*]}"
            {
              echo '### Signed IPA status'
              echo
              echo 'Simulator build completed. Signed IPA was not attempted because Apple signing assets are not configured.'
              echo
              echo 'Required repository secrets:'
              for v in "${missing[@]}"; do echo "- \`$v\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install signing assets into temporary keychain
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_APP_ID=$PROFILE_APP_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Verify provisioning profile matches app
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE_APP_ID" in
            "$IOS_TEAM_ID.$BUNDLE_ID"|"$IOS_TEAM_ID.*")
              echo 'Provisioning profile matches bundle id.'
              ;;
            *)
              echo "::error::Provisioning profile application-identifier '$PROFILE_APP_ID' does not match '$IOS_TEAM_ID.$BUNDLE_ID'"
              exit 1
              ;;
          esac

      - name: Archive signed app
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project HoiDungMoDung.xcodeproj \
            -scheme HoiDungMoDung \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HoiDungMoDung.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            archive

      - name: Create export options
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HoiDungMoDung.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -f "$RUNNER_TEMP/ipa/HoiDungMoDung.ipa"
          shasum -a 256 "$RUNNER_TEMP/ipa/HoiDungMoDung.ipa"

      - name: Upload signed IPA
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hoi-dung-mo-dung-ios-adhoc-ipa
          path: ${{ runner.temp }}/ipa/HoiDungMoDung.ipa
          if-no-files-found: error

      - name: Cleanup signing assets
        if: always()
        shell: bash
        run: |
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
