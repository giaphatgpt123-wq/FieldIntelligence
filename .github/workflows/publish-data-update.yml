name: Publish Data Update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Data package version
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build offline data package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/update
          cd app/src/main/assets/offline-map
          zip -j "../../../../../dist/update/offline-map-${{ inputs.version }}.pack" *.region *.points *.lines *.polygons 2>/dev/null || zip -j "../../../../../dist/update/offline-map-${{ inputs.version }}.pack" *.region *.points *.lines

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail
          FILE="dist/update/offline-map-${{ inputs.version }}.pack"
          SHA=$(sha256sum "$FILE" | awk '{print $1}')
          SIZE=$(stat -c%s "$FILE")
          cat > dist/update/manifest.json <<EOF
          {
            "version": ${{ inputs.version }},
            "schemaVersion": 1,
            "minAppVersionCode": 1,
            "packageName": "vn.fieldintel.app",
            "sha256": "$SHA",
            "sizeBytes": $SIZE
          }
          EOF

      - name: Publish rolling data release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-latest
          name: FieldIntelligence Data Update
          prerelease: true
          make_latest: false
          files: |
            dist/update/manifest.json
            dist/update/offline-map-${{ inputs.version }}.pack
