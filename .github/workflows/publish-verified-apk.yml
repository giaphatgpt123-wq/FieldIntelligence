name: Publish Verified APK

on:
  workflow_run:
    workflows: [ "Android P0 Build" ]
    types: [ completed ]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the latest verified build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "${SOURCE_SHA}" != "${latest}" ]; then
            echo "Build is no longer main HEAD; skipping release."
            exit 0
          fi
          mkdir -p dist
          gh run download "${SOURCE_RUN}" --repo "${GITHUB_REPOSITORY}" --name FieldIntelligence-main-release --dir dist
          test -s dist/app-release.apk
          unzip -t dist/app-release.apk >/dev/null
          unzip -p dist/app-release.apk assets/scientific-library/FieldIntelligence-WFO-mobile.zip > dist/scientific-library.zip
          python3 - <<'PY'
          import json, sqlite3, tempfile, zipfile
          from pathlib import Path
          with zipfile.ZipFile('dist/scientific-library.zip') as z:
              assert z.testzip() is None
              manifest = json.loads(z.read('scientific-library.manifest.json'))
              assert manifest['bundle'] == 'FieldIntelligence-WFO-mobile-selected-genera'
              with tempfile.TemporaryDirectory() as directory:
                  path = Path(directory) / 'wfo-taxonomy.sqlite'
                  path.write_bytes(z.read('wfo-taxonomy.sqlite'))
                  with sqlite3.connect(path) as db:
                      assert db.execute('SELECT COUNT(*) FROM taxon').fetchone()[0] == 38100
          PY
          short_sha="${SOURCE_SHA:0:12}"
          mv dist/app-release.apk "dist/FieldIntelligence-${short_sha}.apk"
          if gh release view "fieldintel-${short_sha}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi
          gh release create "fieldintel-${short_sha}" "dist/FieldIntelligence-${short_sha}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "FieldIntelligence - bản cập nhật ${short_sha}" \
            --notes "APK bản chính đã qua CI; gồm thư viện WFO tự nạp và danh mục cá nước ngọt. Nhận dạng loài bằng ảnh cần model đã kiểm chứng." \
