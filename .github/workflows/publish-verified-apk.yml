name: Publish Verified APK

on:
  workflow_run:
    workflows: [ "Android P0 Build" ]
    types: [ completed ]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from the latest verified build
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.commit.sha')"
          if [ "${SOURCE_SHA}" != "${latest}" ]; then
            echo "Build is no longer main HEAD; skipping release."
            exit 0
          fi
          mkdir -p dist
          gh run download "${SOURCE_RUN}" --repo "${GITHUB_REPOSITORY}" --name FieldIntelligence-main-release --dir dist
          gh run download "${SOURCE_RUN}" --repo "${GITHUB_REPOSITORY}" --name FieldIntelligence-P0-debug --dir dist
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          for apk in dist/app-debug.apk dist/app-release.apk; do
            unzip -p "$apk" assets/visual-model/aiy-plants-v1.tflite | sha256sum | grep -q "^9ff2cc02d066fc266045ce299f04fb76907d9313d576881b61c255aa19433521 "
          done
          test -s dist/app-release.apk
          unzip -t dist/app-release.apk >/dev/null
          unzip -p dist/app-release.apk assets/scientific-library/FieldIntelligence-WFO-mobile.zip > dist/scientific-library.zip
          python3 - <<'PY'
          import json, os, sqlite3, tempfile, zipfile
          from pathlib import Path
          with zipfile.ZipFile('dist/scientific-library.zip') as z:
              assert z.testzip() is None
              manifest = json.loads(z.read('scientific-library.manifest.json'))
              assert manifest['bundle'] == 'FieldIntelligence-WFO-mobile-selected-genera'
              with tempfile.TemporaryDirectory() as directory:
                  path = Path(directory) / 'wfo-taxonomy.sqlite'
                  path.write_bytes(z.read('wfo-taxonomy.sqlite'))
                  with sqlite3.connect(path) as db:
                      count = db.execute('SELECT COUNT(*) FROM taxon').fetchone()[0]
                      assert count >= 38100, count
                      assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
                      meta = {k: json.loads(v) for k, v in db.execute('SELECT key,value FROM meta')}
                      fish_taxa = int(meta.get('fishTaxa', 0) or 0)
                      fish_local = int(meta.get('fishWithLocalMedia', 0) or 0)
                      local_blobs = int(meta.get('localMediaBlobCount', 0) or 0)
                      assert fish_taxa > 0, 'Verified APK release blocked: no real freshwater-fish taxa merged into scientific SQLite'
                      assert fish_local > 0, 'Verified APK release blocked: fish records have no verified offline images'
                      assert local_blobs > 0, 'Verified APK release blocked: no embedded scientific media blobs'
                      assert fish_local <= fish_taxa, (fish_local, fish_taxa)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'FISH_TAXA={fish_taxa}\n')
              env.write(f'FISH_LOCAL={fish_local}\n')
              env.write(f'FISH_BLOBS={local_blobs}\n')
          print({'packRecords': count, 'fishTaxa': fish_taxa, 'fishWithLocalMedia': fish_local, 'localMediaBlobCount': local_blobs})
          PY
          short_sha="${SOURCE_SHA:0:12}"
          mv dist/app-release.apk "dist/FieldIntelligence-${short_sha}.apk"
          mv dist/app-debug.apk "dist/FieldIntelligence-Upgrade-Installed-${short_sha}.apk"
          if gh release view "fieldintel-${short_sha}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release already exists."
            exit 0
          fi
          gh release create "fieldintel-${short_sha}" \
            "dist/FieldIntelligence-${short_sha}.apk" \
            "dist/FieldIntelligence-Upgrade-Installed-${short_sha}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SOURCE_SHA}" \
            --title "FieldIntelligence - bản cập nhật ${short_sha}" \
            --notes "Hai APK đã qua CI: Upgrade-Installed cập nhật gói osmtest đã cài với cùng chữ ký; bản còn lại dành cho cài mới. Gói khoa học có WFO và dữ liệu cá nước ngọt đã qua gate: ${FISH_LOCAL}/${FISH_TAXA} taxon cá có ảnh offline xác minh, ${FISH_BLOBS} blob ảnh được nhúng. Model Google AIY Plants chỉ gợi ý tên trong phạm vi nhãn thực vật; không xác định ăn được, độc tính hoặc xử trí y khoa. Camera quét nhiều vùng vẫn cần detector riêng."
