name: SurvivalLibraryVN Data Engine Pilot

on:
  push:
    branches:
      - survival-library-vn
      - 'feature/data-engine-*'
      - 'fix/data-engine-*'
    paths:
      - 'SurvivalLibraryVN/tools/data_engine_v2.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_runtime.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_state.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_shards.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_progress_shards.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_progress_publish.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_sources.json'
      - 'SurvivalLibraryVN/data/staging/pilot-12-tasks.json'
      - 'SurvivalLibraryVN/data/staging/vietnam_authority.json'
      - 'SurvivalLibraryVN/data/staging/curated_canary_media.json'
      - '.github/workflows/survival-library-data-engine-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survival-library-data-engine-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate task seed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('SurvivalLibraryVN/data/staging/pilot-12-tasks.json')
          rows = json.loads(p.read_text(encoding='utf-8'))
          assert len(rows) == 48, len(rows)
          ids = [r['taskId'] for r in rows]
          assert len(ids) == len(set(ids))
          entities = {r['canonicalId'] for r in rows}
          assert len(entities) == 12, len(entities)
          required = {'CANONICAL_IDENTITY','VIETNAMESE_ALIASES','VIETNAM_DISTRIBUTION','MEDIA_PRIMARY'}
          for entity in entities:
              fields = {r['field'] for r in rows if r['canonicalId'] == entity}
              assert fields == required, (entity, fields)
          print('Pilot seed OK: 12 entities / 48 independent tasks')
          PY

      - name: Collect independent evidence tasks with bounded runtime
        env:
          DATA_ENGINE_HTTP_TIMEOUT: '20'
        run: |
          python SurvivalLibraryVN/tools/data_engine_v2_runtime.py \
            --tasks SurvivalLibraryVN/data/staging/pilot-12-tasks.json \
            --output SurvivalLibraryVN/data/staging/latest-collector-results.json \
            --health-file SurvivalLibraryVN/data/staging/source-health-pipeline.json \
            --limit 500

      - name: Merge evidence shards and build legacy progress snapshot
        run: |
          python SurvivalLibraryVN/tools/data_engine_v2_state.py

      - name: Publish category progress shards
        run: |
          python SurvivalLibraryVN/tools/data_engine_v2_progress_publish.py

      - name: Validate snapshot, evidence and progress shard contracts
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('SurvivalLibraryVN/data/staging')
          snapshot_raw = (root / 'progress-snapshot.json').read_bytes()
          snapshot = json.loads(snapshot_raw)
          index = json.loads((root / 'progress-index.json').read_text(encoding='utf-8'))
          evidence_index = json.loads((root / 'evidence-index.json').read_text(encoding='utf-8'))
          progress = index['progressShards']
          assert snapshot['schemaVersion'] == 1
          assert len(snapshot['entities']) == 12
          assert len(snapshot['tasks']) == 48
          assert hashlib.sha256(snapshot_raw).hexdigest() == index['snapshot']['sha256']
          assert index['snapshot']['entityCount'] == 12
          assert index['snapshot']['taskCount'] == 48
          assert index['evidence']['evidenceCount'] == evidence_index['evidenceCount']
          assert index['evidence']['shardCount'] == evidence_index['shardCount']

          evidence_total = 0
          for shard in evidence_index['shards']:
              path = root / 'evidence' / shard['file']
              raw = path.read_bytes()
              payload = json.loads(raw)
              assert hashlib.sha256(raw).hexdigest() == shard['sha256']
              assert len(raw) == shard['bytes']
              assert len(payload['evidence']) == shard['evidenceCount']
              assert len(raw) <= evidence_index['maxShardBytes']
              evidence_total += shard['evidenceCount']
          assert evidence_total == evidence_index['evidenceCount']

          assert progress['schemaVersion'] == 1
          assert progress['version'] == snapshot['version']
          assert progress['shardCount'] == 12
          entity_total = alias_total = field_total = task_total = 0
          for shard in progress['shards']:
              path = root / 'progress' / shard['file']
              raw = path.read_bytes()
              payload = json.loads(raw)
              assert hashlib.sha256(raw).hexdigest() == shard['sha256']
              assert len(raw) == shard['bytes']
              assert len(raw) <= progress['maxShardBytes']
              assert payload['categoryId'] == shard['categoryId']
              assert payload['version'] == snapshot['version']
              assert len(payload['entities']) == shard['entityCount']
              assert len(payload['aliases']) == shard['aliasCount']
              assert len(payload['fields']) == shard['fieldCount']
              assert len(payload['tasks']) == shard['taskCount']
              entity_total += shard['entityCount']
              alias_total += shard['aliasCount']
              field_total += shard['fieldCount']
              task_total += shard['taskCount']
          assert entity_total == len(snapshot['entities'])
          assert alias_total == len(snapshot['aliases'])
          assert field_total == len(snapshot['fields'])
          assert task_total == len(snapshot['tasks'])
          source_meta = progress['sourceHealth']
          source_raw = (root / 'progress' / source_meta['file']).read_bytes()
          source_payload = json.loads(source_raw)
          assert hashlib.sha256(source_raw).hexdigest() == source_meta['sha256']
          assert len(source_raw) == source_meta['bytes']
          assert len(source_payload['sourceHealth']) == source_meta['rowCount']
          assert len(source_payload['sourceHealth']) == len(snapshot['sourceHealth'])

          blocked = sum(1 for t in snapshot['tasks'] if t['status'] == 'BLOCKED')
          retry = sum(1 for t in snapshot['tasks'] if t['status'] == 'RETRY')
          completed = sum(1 for t in snapshot['tasks'] if t['status'] == 'COMPLETED')
          print(
              f'Pilot: completed={completed} retry={retry} blocked={blocked} '
              f'evidence={evidence_total} progressShards={progress["shardCount"]}'
          )
          assert blocked == 0
          PY

      - name: Drop ephemeral collector output before Git commit
        run: |
          git restore --worktree SurvivalLibraryVN/data/staging/latest-collector-results.json || true

      - name: Commit sharded progress without rewriting monolithic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            SurvivalLibraryVN/data/staging/source-health-pipeline.json \
            SurvivalLibraryVN/data/staging/evidence-index.json \
            SurvivalLibraryVN/data/staging/evidence \
            SurvivalLibraryVN/data/staging/progress \
            SurvivalLibraryVN/data/staging/progress-snapshot.json \
            SurvivalLibraryVN/data/staging/progress-index.json
          if git diff --cached --quiet; then
            echo "No staging progress changes to commit."
          else
            git commit -m "Update category-sharded Data Engine V2 progress"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
