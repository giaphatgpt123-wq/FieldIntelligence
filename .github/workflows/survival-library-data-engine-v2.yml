name: SurvivalLibraryVN Data Engine V2

on:
  push:
    branches:
      - survival-library-vn
      - 'feature/data-engine-*'
      - 'fix/data-engine-*'
    paths:
      - 'SurvivalLibraryVN/tools/data_engine_v2.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_runtime.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_state.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_shards.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_progress_shards.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_progress_publish.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_sources.json'
      - 'SurvivalLibraryVN/tools/tests/test_data_engine_v2*.py'
      - 'SurvivalLibraryVN/data/staging/pilot-12-tasks.json'
      - 'SurvivalLibraryVN/data/staging/vietnam_authority.json'
      - 'SurvivalLibraryVN/data/staging/curated_canary_media.json'
      - '.github/workflows/survival-library-data-engine-v2.yml'
  pull_request:
    branches:
      - survival-library-vn
    paths:
      - 'SurvivalLibraryVN/tools/data_engine_v2.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_runtime.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_state.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_shards.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_progress_shards.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_progress_publish.py'
      - 'SurvivalLibraryVN/tools/data_engine_v2_sources.json'
      - 'SurvivalLibraryVN/tools/tests/test_data_engine_v2*.py'
      - 'SurvivalLibraryVN/data/staging/pilot-12-tasks.json'
      - 'SurvivalLibraryVN/data/staging/vietnam_authority.json'
      - 'SurvivalLibraryVN/data/staging/curated_canary_media.json'
      - '.github/workflows/survival-library-data-engine-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-data-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile collector runtime and state bridge
        run: |
          python -m py_compile SurvivalLibraryVN/tools/data_engine_v2.py
          python -m py_compile SurvivalLibraryVN/tools/data_engine_v2_runtime.py
          python -m py_compile SurvivalLibraryVN/tools/data_engine_v2_state.py
          python -m py_compile SurvivalLibraryVN/tools/data_engine_v2_shards.py
          python -m py_compile SurvivalLibraryVN/tools/data_engine_v2_progress_shards.py
          python -m py_compile SurvivalLibraryVN/tools/data_engine_v2_progress_publish.py

      - name: Unit tests without network
        run: python -m unittest discover -s SurvivalLibraryVN/tools/tests -p 'test_data_engine_v2*.py' -v

      - name: Validate source registry and pilot seed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('SurvivalLibraryVN/tools/data_engine_v2_sources.json').read_text(encoding='utf-8'))
          assert registry['schemaVersion'] == 1
          ids = [s['id'] for s in registry['sources']]
          assert len(ids) == len(set(ids)), 'duplicate source id'
          assert any(s['tier'] == 'OFFICIAL_VIETNAM' for s in registry['sources'])
          assert any(s.get('id') == 'curated-canary-media' and s.get('tier') == 'OPEN_SCIENCE' for s in registry['sources'])
          assert any(s.get('adapter') == 'gbif' and s.get('automated') for s in registry['sources'])
          assert any(s.get('adapter') == 'worms' and s.get('automated') for s in registry['sources'])
          assert any(s.get('adapter') == 'inaturalist' and s.get('automated') for s in registry['sources'])

          tasks = json.loads(Path('SurvivalLibraryVN/data/staging/pilot-12-tasks.json').read_text(encoding='utf-8'))
          assert len(tasks) == 48
          assert len({t['taskId'] for t in tasks}) == 48
          assert len({t['canonicalId'] for t in tasks}) == 12
          print(f'Registry OK: {len(ids)} sources · pilot 12 entities / 48 tasks')
          PY
