name: SurvivalLibraryVN Build

on:
  push:
    branches:
      - survival-library-vn
      - 'feature/data-engine-*'
    paths:
      - 'SurvivalLibraryVN/app/**'
      - 'SurvivalLibraryVN/build.gradle.kts'
      - 'SurvivalLibraryVN/settings.gradle.kts'
      - 'SurvivalLibraryVN/gradle.properties'
      - '.github/workflows/survival-library-vn-build.yml'
  pull_request:
    branches: [survival-library-vn]
    paths:
      - 'SurvivalLibraryVN/app/**'
      - 'SurvivalLibraryVN/build.gradle.kts'
      - 'SurvivalLibraryVN/settings.gradle.kts'
      - 'SurvivalLibraryVN/gradle.properties'
      - '.github/workflows/survival-library-vn-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p SurvivalLibraryVN :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p SurvivalLibraryVN :app:assembleDebug --stacktrace

      - name: Enable KVM for PR runtime gate
        if: github.event_name == 'pull_request'
        run: sudo chmod 666 /dev/kvm || true

      - name: Android instrumentation gate on PR
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: gradle -p SurvivalLibraryVN :app:connectedDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalLibraryVN-debug
          path: SurvivalLibraryVN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
