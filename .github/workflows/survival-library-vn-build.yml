name: SurvivalLibraryVN Build

on:
  push:
    branches: [survival-library-vn]
    paths:
      - 'SurvivalLibraryVN/app/**'
      - 'SurvivalLibraryVN/build.gradle.kts'
      - 'SurvivalLibraryVN/settings.gradle.kts'
      - 'SurvivalLibraryVN/gradle.properties'
      - '.github/workflows/survival-library-vn-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle -p SurvivalLibraryVN :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p SurvivalLibraryVN :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalLibraryVN-debug
          path: SurvivalLibraryVN/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
