name: Publish SurvivalLibraryVN APK

on:
  push:
    branches: [survival-library-vn]
    paths:
      - 'SurvivalLibraryVN/**'
      - '.github/workflows/survival-library-vn-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve app version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' SurvivalLibraryVN/app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=survival-library-vn-v$VERSION" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle -p SurvivalLibraryVN :app:testDebugUnitTest --stacktrace

      - name: Build unsigned release APK
        run: gradle -p SurvivalLibraryVN :app:assembleRelease --stacktrace

      - name: Sign beta APK with stable AOSP development test key
        shell: bash
        run: |
          set -euo pipefail
          KEY_BASE='https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security'
          curl --retry 5 --retry-all-errors --connect-timeout 15 -fsSL "$KEY_BASE/testkey.pk8" -o "$RUNNER_TEMP/testkey.pk8"
          curl --retry 5 --retry-all-errors --connect-timeout 15 -fsSL "$KEY_BASE/testkey.x509.pem" -o "$RUNNER_TEMP/testkey.x509.pem"
          test -s "$RUNNER_TEMP/testkey.pk8"
          test -s "$RUNNER_TEMP/testkey.x509.pem"

          UNSIGNED_APK=$(find SurvivalLibraryVN/app/build/outputs/apk/release -type f -name '*unsigned.apk' | head -n1)
          test -n "$UNSIGNED_APK"
          test -s "$UNSIGNED_APK"

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/SurvivalLibraryVN-aligned.apk"
          "$APKSIGNER" sign \
            --key "$RUNNER_TEMP/testkey.pk8" \
            --cert "$RUNNER_TEMP/testkey.x509.pem" \
            --out SurvivalLibraryVN.apk \
            "$RUNNER_TEMP/SurvivalLibraryVN-aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs SurvivalLibraryVN.apk | tee SurvivalLibraryVN.signature.txt
          "$AAPT" dump badging SurvivalLibraryVN.apk | tee SurvivalLibraryVN.badging.txt
          grep -q "package: name='vn.survivallibrary.vn'" SurvivalLibraryVN.badging.txt
          sha256sum SurvivalLibraryVN.apk > SurvivalLibraryVN.apk.sha256
          test -s SurvivalLibraryVN.apk

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Beta v$APP_VERSION của Thư viện Sinh tồn Việt Nam. Package beta ổn định: vn.survivallibrary.vn. APK dùng chữ ký beta cố định để cập nhật đè giữa các bản thử nghiệm. Dữ liệu DEMO không được coi là nội dung sinh tồn đã kiểm chứng."
          if gh release view "$RELEASE_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" SurvivalLibraryVN.apk SurvivalLibraryVN.apk.sha256 SurvivalLibraryVN.signature.txt SurvivalLibraryVN.badging.txt --clobber -R "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" SurvivalLibraryVN.apk SurvivalLibraryVN.apk.sha256 SurvivalLibraryVN.signature.txt SurvivalLibraryVN.badging.txt \
              --target survival-library-vn \
              --title "Thư viện Sinh tồn Việt Nam v$APP_VERSION" \
              --notes "$NOTES" \
              -R "${{ github.repository }}"
          fi
