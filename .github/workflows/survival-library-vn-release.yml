name: Publish SurvivalLibraryVN APK

on:
  push:
    branches: [survival-library-vn]
    paths:
      - '.github/workflows/survival-library-vn-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test
        run: gradle -p SurvivalLibraryVN :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: |
          set -euo pipefail
          gradle -p SurvivalLibraryVN :app:assembleDebug --stacktrace
          cp SurvivalLibraryVN/app/build/outputs/apk/debug/app-debug.apk SurvivalLibraryVN.apk
          test -s SurvivalLibraryVN.apk
          sha256sum SurvivalLibraryVN.apk > SurvivalLibraryVN.apk.sha256

      - name: Publish stable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='survival-library-vn-v0.1.0'
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" SurvivalLibraryVN.apk SurvivalLibraryVN.apk.sha256 --clobber -R "${{ github.repository }}"
          else
            gh release create "$TAG" SurvivalLibraryVN.apk SurvivalLibraryVN.apk.sha256 \
              --target survival-library-vn \
              --title 'Thư viện Sinh tồn Việt Nam v0.1.0' \
              --notes 'Bản thử nghiệm Android mới, package vn.survivallibrary.app. Không Map/GPS. Dùng để kiểm tra khung UI và cấu trúc ứng dụng.' \
              -R "${{ github.repository }}"
          fi
