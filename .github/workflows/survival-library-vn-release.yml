name: Publish SurvivalLibraryVN APK

on:
  push:
    branches: [survival-library-vn]
    paths:
      - 'SurvivalLibraryVN/**'
      - '.github/workflows/survival-library-vn-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Resolve app version
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' SurvivalLibraryVN/app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=survival-library-vn-v$VERSION" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle -p SurvivalLibraryVN :app:testDebugUnitTest --stacktrace

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true

      - name: Runtime launcher smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: gradle -p SurvivalLibraryVN :app:connectedDebugAndroidTest --stacktrace

      - name: Build unsigned release APK
        run: gradle -p SurvivalLibraryVN :app:assembleRelease --stacktrace

      - name: Sign standalone APK with stable test key
        shell: bash
        run: |
          set -euo pipefail
          KEY_BASE='https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security'
          curl --retry 5 --retry-all-errors --connect-timeout 15 -fsSL "$KEY_BASE/testkey.pk8" -o "$RUNNER_TEMP/testkey.pk8"
          curl --retry 5 --retry-all-errors --connect-timeout 15 -fsSL "$KEY_BASE/testkey.x509.pem" -o "$RUNNER_TEMP/testkey.x509.pem"
          test -s "$RUNNER_TEMP/testkey.pk8"
          test -s "$RUNNER_TEMP/testkey.x509.pem"

          UNSIGNED_APK=$(find SurvivalLibraryVN/app/build/outputs/apk/release -type f -name '*unsigned.apk' | head -n1)
          test -n "$UNSIGNED_APK"
          test -s "$UNSIGNED_APK"

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$RUNNER_TEMP/SurvivalLibraryVN-aligned.apk"
          "$APKSIGNER" sign \
            --key "$RUNNER_TEMP/testkey.pk8" \
            --cert "$RUNNER_TEMP/testkey.x509.pem" \
            --out SurvivalLibraryVN-Full.apk \
            "$RUNNER_TEMP/SurvivalLibraryVN-aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs SurvivalLibraryVN-Full.apk | tee SurvivalLibraryVN-Full.signature.txt
          "$AAPT" dump badging SurvivalLibraryVN-Full.apk | tee SurvivalLibraryVN-Full.badging.txt
          grep -q "package: name='vn.survivallibrary.full'" SurvivalLibraryVN-Full.badging.txt
          sha256sum SurvivalLibraryVN-Full.apk > SurvivalLibraryVN-Full.apk.sha256
          test -s SurvivalLibraryVN-Full.apk

      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Bản cài đầy đủ Safe Start v$APP_VERSION. Launcher đầu tiên chạy Android native, không mở Compose/SQLite/network khi khởi động. Release chỉ được phát hành sau khi Activity launcher chạy thành công trên Android emulator. Package: vn.survivallibrary.full."
          if gh release view "$RELEASE_TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" SurvivalLibraryVN-Full.apk SurvivalLibraryVN-Full.apk.sha256 SurvivalLibraryVN-Full.signature.txt SurvivalLibraryVN-Full.badging.txt --clobber -R "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" SurvivalLibraryVN-Full.apk SurvivalLibraryVN-Full.apk.sha256 SurvivalLibraryVN-Full.signature.txt SurvivalLibraryVN-Full.badging.txt \
              --target survival-library-vn \
              --title "Thư viện Sinh tồn Việt Nam v$APP_VERSION - Safe Start" \
              --notes "$NOTES" \
              -R "${{ github.repository }}"
          fi
